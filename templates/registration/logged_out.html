{% extends 'layouts/base-fullscreen.html' %}

{% block title %} Logged Out {% endblock title %}

{% block body_class %} sign-in-illustration {% endblock body_class %}

{% block content %}

<section>
  <div class="page-header section-height-100">
    <div class="container">
      <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7 text-center">

          <div class="card card-plain">

            <div class="card-body py-5">

              <h3 class="mb-3">You have been logged out</h3>

              <p class="text-muted">
                Thanks for using Task Manager.
              </p>

              <a href="{% url 'login' %}"
                 class="btn btn-lg bg-gradient-primary w-100 mt-4">
                Sign in again
              </a>

              <a href="/"
                 class="btn btn-link w-100 mt-2">
                Go to homepage
              </a>

            </div>

          </div>

        </div>

      </div>
    </div>
  </div>
</section>

{% endblock content %}
