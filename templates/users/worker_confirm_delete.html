{% extends "layouts/base-presentation.html" %}

{% block title %}
  Delete Worker
{% endblock %}

{% block content %}

<section class="py-7">
  <div class="container">

    <div class="row justify-content-center">

      <div class="col-lg-6">

        <div class="card shadow-lg border-danger">

          <div class="card-body p-5 text-center">

            <h4 class="text-danger mb-3">
              Confirm Delete
            </h4>

            <p class="mb-4">
              Are you sure you want to delete worker:
              <strong>{{ worker.username }}</strong> ?
            </p>

            <form method="post">

              {% csrf_token %}

              <div class="d-flex justify-content-center gap-3">

                <a href="{% url "users:worker-detail" pk=worker.id %}"
                   class="btn btn-outline-secondary mb-0">
                  Cancel
                </a>

                <button type="submit"
                        class="btn bg-gradient-danger mb-0">
                  Delete Worker
                </button>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>
</section>

{% endblock %}
