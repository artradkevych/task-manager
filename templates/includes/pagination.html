{% load query_transform %}

{% if is_paginated %}

<div class="d-flex justify-content-center mt-5">

  <ul class="pagination pagination-lg">

    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link rounded-circle d-flex align-items-center justify-content-center"
           style="width: 48px; height: 48px;"
           href="?{% query_transform request page=page_obj.previous_page_number %}">
          ‹
        </a>
      </li>
    {% endif %}

    <li class="page-item active">
      <span class="page-link rounded-circle d-flex align-items-center justify-content-center"
            style="width: 48px; height: 48px;">
        {{ page_obj.number }}
      </span>
    </li>

    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link rounded-circle d-flex align-items-center justify-content-center"
           style="width: 48px; height: 48px;"
           href="?{% query_transform request page=page_obj.next_page_number %}">
          ›
        </a>
      </li>
    {% endif %}

  </ul>

</div>

{% endif %}
